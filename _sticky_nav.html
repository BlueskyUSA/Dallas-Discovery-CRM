<style>
html{scroll-padding-top:66px}
.sn{position:fixed;top:0;left:0;right:0;z-index:1000;background:#0c4561;color:#fff;font-family:Inter,Arial,sans-serif;
    box-shadow:0 2px 10px rgba(0,0,0,.25);transform:translateY(-110%);transition:transform .25s ease}
.sn.show{transform:translateY(0)}
.sn-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 18px;max-width:1300px;margin:0 auto}
.sn a{color:#fff;text-decoration:none}
.sn-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.05rem;white-space:nowrap}
.sn-brand img{height:30px;width:auto}
.sn-links{display:none;gap:20px;font-size:.93rem}
.sn-links a{opacity:.92;white-space:nowrap}.sn-links a:hover{opacity:1;text-decoration:underline}
.sn-btn{background:#fff;color:#0c4561!important;font-weight:700;font-size:.85rem;letter-spacing:.03em;padding:9px 16px;border-radius:22px;white-space:nowrap}
.sn-right{display:flex;align-items:center;gap:10px}
.sn-menu{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:6px;padding:7px 12px;font:600 .9rem Inter,Arial,sans-serif;cursor:pointer}
.sn-panel{display:none;background:#0c4561;border-top:1px solid rgba(255,255,255,.2);padding:6px 18px 14px}
.sn-panel.open{display:block}
.sn-panel a{display:block;padding:12px 4px;font-size:1.05rem;border-bottom:1px solid rgba(255,255,255,.12)}
@media (min-width:900px){.sn-links{display:flex}.sn-menu,.sn-panel{display:none!important}}
</style>
<div class="sn" id="sn" aria-label="Site menu">
  <div class="sn-in">
    <a class="sn-brand" href="{{ url_for('public_home') }}"><img src="{{ url_for('static', filename='logo-emblem.png') }}" alt="">{{ public_brand }}</a>
    <nav class="sn-links">
      <a href="{{ url_for('public_home') }}">Home</a>
      <a href="{{ url_for('public_program_page', slug='the-art-of-us') }}">The Art of Us</a>
      <a href="{{ url_for('public_program_page', slug='the-beginning') }}">The Beginning</a>
      <a href="{{ url_for('public_program_page', slug='awakening') }}">Awakening</a>
      <a href="{{ url_for('public_program_page', slug='vision') }}">Vision</a>
      <a href="{{ url_for('public_about_program') }}">About</a>
      <a href="{{ url_for('public_stories') }}">In Their Own Words</a>
    </nav>
    <div class="sn-right">
      <a class="sn-btn" href="{{ url_for('public_register') }}#interested">Reserve Your Spot</a>
      <button class="sn-menu" type="button" id="sn-menu" aria-expanded="false">Menu</button>
    </div>
  </div>
  <div class="sn-panel" id="sn-panel">
    <a href="{{ url_for('public_home') }}">Home</a>
    <a href="{{ url_for('public_program_page', slug='the-art-of-us') }}">The Art of Us</a>
    <a href="{{ url_for('public_program_page', slug='the-beginning') }}">The Beginning</a>
    <a href="{{ url_for('public_program_page', slug='awakening') }}">Awakening</a>
    <a href="{{ url_for('public_program_page', slug='vision') }}">Vision</a>
    <a href="{{ url_for('public_about_program') }}">About</a>
    <a href="{{ url_for('public_stories') }}">In Their Own Words</a>
  </div>
</div>
<script>
(function(){
  var bar=document.getElementById('sn'),btn=document.getElementById('sn-menu'),panel=document.getElementById('sn-panel');
  function upd(){var y=window.pageYOffset||document.documentElement.scrollTop;bar.classList.toggle('show',y>260);
    if(y<=260){panel.classList.remove('open');btn.setAttribute('aria-expanded','false');}}
  window.addEventListener('scroll',upd,{passive:true});upd();
  btn.addEventListener('click',function(){var o=panel.classList.toggle('open');btn.setAttribute('aria-expanded',o?'true':'false');});
  panel.addEventListener('click',function(e){if(e.target.tagName==='A')panel.classList.remove('open');});
})();
</script>
