<style>
  .field label.req { background:#cfe8c8; border:1px solid #6fae5f; border-radius:5px; padding:1px 7px; color:#111; font-weight:700; }
  .field label.req.filled { background:#8fd081; border-color:#3f8f2f; }
  .field label.req.filled::after { content:" \2713"; }
  .field:has(label.req) { background:#e6f4e1; border:1px solid #9fcf92; border-radius:8px; padding:8px 10px; }
  .field:has(label.req.filled) { background:#d4eccb; border-color:#5fa84f; }
  .field:has(label.req) input, .field:has(label.req) select { border-color:#6fae5f; background:#fff; }
  .req-sample { background:#cfe8c8; border:1px solid #6fae5f; border-radius:5px; padding:0 6px; font-weight:700; }
  .stage-note { font-size:0.85rem; font-weight:400; margin-left:8px; }
  .stage-note.done { color:#2b7a2b; font-weight:700; }
  .stage-note.todo { color:#8a6d00; }
  .stage-banner { background:#d7ecd0; border:2px solid #8cbf7f; border-radius:8px; padding:10px 14px; margin:10px 0; font-weight:700; color:#1f5f1f; }
  .rolebox { position:relative; max-width:340px; }
  .rolebtn { width:100%; text-align:left; background:#fff; border:1px solid var(--border, #bbb); border-radius:6px; padding:8px 10px; font:inherit; cursor:pointer; }
  .rolepanel { position:absolute; z-index:20; left:0; right:0; background:#fff; border:1px solid var(--border, #bbb); border-radius:6px; margin-top:2px; box-shadow:0 4px 14px rgba(0,0,0,.15); max-height:280px; overflow:auto; }
  .rolerow { display:flex; gap:8px; align-items:center; padding:7px 10px; margin:0; font-weight:400; cursor:pointer; }
  .rolerow:hover { background:#f3f6f3; }
  .role-popup { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:1000; display:flex; align-items:center; justify-content:center; }
  .role-popup-card { background:#fff; border-radius:10px; padding:22px 24px; max-width:420px; margin:16px; box-shadow:0 8px 30px rgba(0,0,0,.3); }
</style>
<script>
(function () {
  var form = document.getElementById('profile-form') || document.getElementById('contact-form');
  if (!form) return;
  var stages = {
    basics:  ['first_name', 'last_name', 'photo'],
    contact: ['email', 'cell_phone', 'street_address', 'city', 'state', 'zip'],
    family:  ['emergency_contact_name', 'emergency_contact_cell']
  };
  var names = {basics: 'Basics', contact: 'Contact information', family: 'Family & emergency contact'};
  function el(n) { return form.querySelector('[name="' + n + '"]'); }
  function filled(n) {
    var e = el(n); if (!e) return true;
    if (e.type === 'file') return (e.files && e.files.length > 0) || e.getAttribute('data-has') === '1';
    return (e.value || '').trim() !== '';
  }
  function update() {
    var all = true;
    Object.keys(stages).forEach(function (k) {
      var left = 0;
      stages[k].forEach(function (n) {
        var f = filled(n); if (!f) left++;
        var e = el(n), lab = e && e.closest('.field') && e.closest('.field').querySelector('label.req');
        if (lab) lab.classList.toggle('filled', f);
      });
      var note = form.querySelector('.stage-note[data-stage="' + k + '"]');
      if (note) {
        note.textContent = left === 0 ? '✓ ' + names[k] + ' completed' : '(' + left + ' left)';
        note.className = 'stage-note ' + (left === 0 ? 'done' : 'todo');
      }
      if (left) all = false;
    });
    var b = document.getElementById('basic-complete');
    if (b) b.style.display = all ? '' : 'none';
  }
  form.addEventListener('input', update);
  form.addEventListener('change', update);
  update();

  // ---- Previous Discovery! role: check boxes in a drop-down ----
  var btn = document.getElementById('rolebtn'), panel = document.getElementById('rolepanel'),
      sum = document.getElementById('rolesummary'), pop = document.getElementById('role-popup');
  if (!btn) return;
  var boxes = Array.prototype.slice.call(panel.querySelectorAll('input[type=checkbox]'));
  function chosen() { return boxes.filter(function (c) { return c.checked; }).map(function (c) { return c.value; }); }
  function summary() { var c = chosen(); sum.textContent = c.length ? c.join(', ') : 'Choose…'; }
  function qualifying() { return chosen().filter(function (v) { return v !== 'None' && v !== 'Interested Party'; }).length > 0; }
  function syncAttendance() {
    var s = el('discovery_attendance'); if (!s) return;
    var want = qualifying() ? 'Yes' : (chosen().length ? 'No' : null);
    if (want && s.value !== want) { s.value = want; s.dispatchEvent(new Event('change', {bubbles: true})); }
  }
  btn.addEventListener('click', function () {
    var open = panel.style.display === 'none'; panel.style.display = open ? '' : 'none'; btn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', function (e) { if (!document.getElementById('rolebox').contains(e.target)) panel.style.display = 'none'; });
  boxes.forEach(function (c) {
    c.addEventListener('change', function () {
      var was = qualifyingBefore;
      if (c.checked && c.value === 'None') boxes.forEach(function (o) { if (o !== c) o.checked = false; });
      else if (c.checked) boxes.forEach(function (o) { if (o.value === 'None') o.checked = false; });
      summary(); syncAttendance();
      if (!was && qualifying()) pop.style.display = '';
      qualifyingBefore = qualifying();
    });
  });
  var qualifyingBefore = qualifying();
  document.getElementById('role-popup-ok').addEventListener('click', function () { pop.style.display = 'none'; });
  summary();
})();
</script>
